name: Add bbg
description: add and enable bbg into the kernel

runs:
  using: composite
  steps:
   - name: add bbg into kernel
     shell: bash
     run: |
      cd "$COMMON"
      echo "Adding BBG..."
      # Pinned to the state used by 2.3.0-r4 (setup.sh only checks out a ref in an existing clone)
      git clone https://github.com/vc-teahouse/Baseband-guard Baseband-guard
      curl -LSs https://github.com/vc-teahouse/Baseband-guard/raw/a54e0dc6cf0aff4dd87fec49644a02d2eb612905/setup.sh | bash -s a54e0dc6cf0aff4dd87fec49644a02d2eb612905
      
   - name: enable bbg in defconfig
     shell: bash
     run: |
      "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_BBG

   - name: add bbg into kconfig
     shell: bash
     run: |
       cd "$COMMON"
       sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

   - name: if config_lsm is in defconfig, add bbg
     shell: bash
     run: |
      cd "$GITHUB_WORKSPACE"
      sed -i '/^CONFIG_LSM=/ s/"$/,baseband_guard"/' "$GKI_DEFCONFIG"

name: Set up KernelSU-Next
description: download and set up KSUN into the kernel source
inputs:
 susfs:
  description: 'susfs'
  required: true


runs:
  using: composite
  steps:
    - name: Setup KSUN with no susfs
      if: inputs.susfs == 'false'
      shell: bash
      run: |
        cd "$COMMON"
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev

    - name: Setup pershoot KSUN with susfs
      if: inputs.susfs == 'true'
      shell: bash
      run: |
        cd "$COMMON"
        # Pinned to 2.3.0-r4: code from dev-susfs at 910864d (force-pushed away
        # later, so fetched by hash); version 33355 is counted from dev at 4c706b5.
        curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/910864db701e92859b68761fcc6cd7a134061fff/kernel/setup.sh" | bash -s dev-susfs
        git -C KernelSU-Next fetch origin 910864db701e92859b68761fcc6cd7a134061fff 4c706b5938665866ebe16944a481a7b91e3396af
        git -C KernelSU-Next checkout -q 910864db701e92859b68761fcc6cd7a134061fff

    - name: enable in defconfig
      if: inputs.susfs == 'false'
      shell: bash
      run: |
        "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU
      
    - name: Extract KSU Version Info and inject into Kbuild
      shell: bash
      run: |
        cd "$COMMON/KernelSU-Next"

        # Fetch dev branch for version info (tags, commits, etc.)
        git fetch origin dev 2>/dev/null || true
        
        # Extract and export KSU version info from dev branch
        KSU_GIT_VERSION=$(git rev-list --count 4c706b5938665866ebe16944a481a7b91e3396af 2>/dev/null)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 4c706b5938665866ebe16944a481a7b91e3396af 2>/dev/null || echo "")
        KSU_COMMIT=$(git rev-parse --short 4c706b5938665866ebe16944a481a7b91e3396af 2>/dev/null)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))
        [ "$KSU_VERSION" = 33355 ] || { echo "Unexpected KSU version $KSU_VERSION"; exit 1; }

        cd kernel
        sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild
        sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild
        
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV

    - name: 'Fix KernelSU-Next'
      if: inputs.susfs == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON/KernelSU-Next"
        sed -i \
        -e 's/^static int security_context_to_sid_with_policy(/int security_context_to_sid_with_policy(/' \
        -e 's/^static int security_sid_to_context_with_policy(/int security_sid_to_context_with_policy(/' \
        -e 's/^static void security_compute_av_user_with_policy(/void security_compute_av_user_with_policy(/' \
        kernel/feature/selinux_hide.c

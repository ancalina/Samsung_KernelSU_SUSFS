name: add nomount
description: add and configure nomount

runs:
  using: composite
  steps:
   - name: run setup script
     shell: bash
     run: |
      cd "$COMMON"
      # Pinned to the state used by 2.3.0-r4
      curl https://raw.githubusercontent.com/maxsteeel/nomount/682f7b20bc3c177871c80bbd02c600e472f0df46/kernel/setup.sh | bash -s 682f7b20bc3c177871c80bbd02c600e472f0df46

   - name: add to defconfig
     shell: bash
     run: |
      "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_NOMOUNT
